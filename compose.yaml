name: arterio-smoke

x-backend: &backend
  image: arterio-backend:smoke
  environment:
    DATABASE_URL: postgresql://arterio:arterio@db:5432/arterio
    STORAGE_DIR: /var/lib/arterio
    APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8000}
    APP_EXTRA_ORIGINS: ${APP_EXTRA_ORIGINS-http://localhost:5173,http://localhost:8080}
    SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-120}
    CHECKPOINT_DIR: /models
    UNET_CHECKPOINT_PATH: ${UNET_CHECKPOINT_PATH:-/models/unet_best.pth}
    UNET_MODEL_VERSION: ${UNET_MODEL_VERSION:-unversioned}
    UNET_DEVICE: ${UNET_DEVICE:-cpu}
    UNET_THRESHOLD: ${UNET_THRESHOLD:-0.5}
  volumes:
    - analysis-files:/var/lib/arterio
    - ./checkpoints:/models:ro
  init: true

services:
  frontend:
    image: arterio-frontend:web
    build:
      context: ./gui/arterio-gui
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/healthz]
      interval: 5s
      timeout: 3s
      retries: 10
    init: true
    restart: unless-stopped

  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: arterio
      POSTGRES_USER: arterio
      POSTGRES_PASSWORD: arterio
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U arterio -d arterio']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    <<: *backend
    command: [python, -m, app.migrate]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    build:
      context: ./backend
      target: runtime
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 10
    restart: unless-stopped

  worker:
    <<: *backend
    image: arterio-worker:unet
    build:
      context: ./backend
      target: worker
    command: [python, -m, app.worker]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  tests:
    image: arterio-backend:tests
    build:
      context: ./backend
      target: tests
    environment:
      DATABASE_URL: postgresql://arterio:arterio@db:5432/arterio
    profiles: [test]
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
  analysis-files:
